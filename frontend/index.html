<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h2 onclick="formToggle()"class="addPassword" style="font-size: 3em;">+</h2>
        <h1 class="title">Password Manager</h1>
        <div>
            <button class="login signUpBtn">Sign up</button>
            <button class="login signInBtn">Sign in</button>
        </div>
    </header>
    
    <form style="display: none;"action="/signin" method="POST"class="form" id="formToSignIn">
        <div onclick="CloseSignIn()"class="signInX" style="top: 80px;cursor: pointer; position: fixed; right: 15vw; font-size: 3em;font-family: arial;">X</div>
        <input type="hidden" name="_method" value="POST">
        <div id="formcom">
            <label for="usernameSignin"style="font-size: 2em;margin-top: 23px;"><b>Username or Email: </b></label>
            <input type="text" id="formcom" name="usernameSignIn" value="">
        </div>
        <div id="formcom">
            <label for="passwordSignIn"style="font-size: 2em;margin-top: 23px;"><b>Password: </b></label>
            <input type="text" id="formcom" name="passwordSignIn" value="">
        </div>
        <button onclick="SignIn()" style="display: flex; justify-self: center;margin-top: 50px;"type="submit">Sign in</button>
    </form>

    <form style="display: none;"action="/signup" method="POST"class="form" id="formToSignUp">
        <div onclick="CloseSignUp()"class="signUpX" style="top: 80px;cursor: pointer; position: fixed; right: 15vw; font-size: 3em;font-family: arial;">X</div>
        <input type="hidden" name="_method" value="POST">
        <div id="formcom">
            <label for="emailSignin" style="font-size: 2em;margin-top: 23px;"><b>Email: </b></label>
            <input type="text" id="formcom" name="emailSignIn" value="">
        </div>
        <div id="formcom">
            <label for="usernameSignin" style="font-size: 2em;margin-top: 23px;"><b>Username: </b></label>
            <input type="text" id="formcom" name="usernameSignIn" value="">
        </div>
        <div id="formcom">
            <label for="passwordSignUp" style="font-size: 2em;margin-top: 23px;"><b>Password: </b></label>
            <input type="text" id="formcom" name="passwordSignUp" value="">
        </div>
        <button onclick="SignUp()" style="display: flex; justify-self: center;margin-top: 50px;"type="submit">Sign Up</button>


    </form>

    <main>
        <div class="section1">
            <div class="searchCont">
                <h2 class="searchTitle">Search</h2>
                <input class="searchInput" placeholder="Search Passwords">
            </div>
            <p class="noPasswordsError"style="text-align: center; margin-left: 20vw; margin-right: 20vw; font-size: 1.5em;">You currently have no passwords, Click "add passwords" in the top left corner to add a password </p>
            <div class="boxes">
            </div>
        </div>


<form style="display: none;"class="formToAddPassword" action="/addPassword" method="POST">
    <div onclick="formToggle()" class="X" style="top: 80px;cursor: pointer; position: fixed; right: 15vw; font-size: 3em;font-family: arial;">X</div>
    <input type="hidden" name="_method" value="POST">

<div id="formcom">
    <label style="font-size: 2em;margin-top: 23px;"for="title"><b>Title:</b></label>
    <input class="formTitle" type="text" id="formcom" name="title" value="">
</div>
<div id="formcom" >
    <label style="font-size: 2em;margin-top: 23px;"for="username"><b>Username:</b></label>
    <input class="formUsername" type="text" id="formcom" name="username" value="">
</div>
<div id="formcom">
    <label style="font-size: 2em;margin-top: 23px;"for="password"><b>Password: </b></label>
    <input class="formPassword" type="text" id="formcom" name="password" value="">
</div>
    <button onclick="addPasswordSubmit()" style="margin-top: 50px;"type="submit">Add</button>
    <p class="errorAddingPassword"style="display: none;">Error adding password</p>
</form>
    </main>
    <footer>

    </footer>


    <script src="script.js"></script>
</body>
</html>
